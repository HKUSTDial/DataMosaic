# docker compose -f docker-compose.yml -f docker-compose.ontology.yml up --build
services:
  ontology:
    build:
      context: ${ONTOLOGY_SOURCE:-./module/Ontology-NL2SQL}
      dockerfile: Dockerfile.web
    env_file: ${ONTOLOGY_ENV_FILE:-./module/Ontology-NL2SQL/.env}
    expose:
      - "8011"
    volumes:
      - type: bind
        source: ${ONTOLOGY_DATABASES:-./module/Ontology-NL2SQL/data/web_databases}
        target: /data/databases
        read_only: true
        bind:
          create_host_path: false
      - ontology_runtime:/data/runtime
volumes:
  ontology_runtime:
