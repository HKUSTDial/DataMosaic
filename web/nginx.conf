server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 210m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /docmosaic { return 308 /docmosaic/$is_args$args; }
    location = /structmosaic { return 308 /structmosaic/$is_args$args; }
    location = /dbmosaic { return 308 /dbmosaic/$is_args$args; }
    location = /analyze { return 308 /docmosaic/$is_args$args; }
    location = /extract { return 308 /dbmosaic/$is_args$args; }
    location = /ontology { return 308 /ontology/; }
    location ~ ^/(ontomosaic-db|ontomosaic-text2sql)/api/ {
        set $ontology_upstream ontology:8011;
        proxy_pass http://$ontology_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /ontology/api/ {
        set $ontology_upstream ontology:8011;
        proxy_pass http://$ontology_upstream;
        proxy_read_timeout 3600s;
    }
    location /ontology/ { try_files $uri $uri/ /index.html; }

    location ~ ^/(docmosaic|analyze)/api/ {
        set $docpilot_upstream docpilot:8008;
        rewrite ^/(docmosaic|analyze)(/api/.*)$ $2 break;
        proxy_pass http://$docpilot_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(docmosaic|analyze)/uploads/ {
        set $docpilot_upstream docpilot:8008;
        rewrite ^/(docmosaic|analyze)(/uploads/.*)$ $2 break;
        proxy_pass http://$docpilot_upstream;
    }

    location ~ ^/(dbmosaic|extract)/ws$ {
        set $datamosaic_ws datamosaic:8765;
        rewrite ^/(dbmosaic|extract)/ws$ / break;
        proxy_pass http://$datamosaic_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /dbmosaic/api/ {
        set $datamosaic_upstream datamosaic:5000;
        rewrite ^/dbmosaic(/api/.*)$ $1 break;
        proxy_pass http://$datamosaic_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        set $datamosaic_upstream datamosaic:5000;
        proxy_pass http://$datamosaic_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
    }

    location /platform/api/ {
        set $platform_upstream api:8000;
        rewrite ^/platform(/api/.*)$ $1 break;
        proxy_pass http://$platform_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ~ ^/analyze(/.*)$ { return 308 /docmosaic$1$is_args$args; }
    location ~ ^/extract(/.*)$ { return 308 /dbmosaic$1$is_args$args; }
    location /docmosaic/ { try_files $uri $uri/ /docmosaic/index.html; }
    location /dbmosaic/ { try_files $uri $uri/ /dbmosaic/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
