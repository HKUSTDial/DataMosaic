server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 52m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /analyze { return 308 /analyze/; }
    location = /extract { return 308 /extract/; }

    location /analyze/api/ {
        set $docpilot_upstream docpilot:8008;
        rewrite ^/analyze(/api/.*)$ $1 break;
        proxy_pass http://$docpilot_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /analyze/uploads/ {
        set $docpilot_upstream docpilot:8008;
        rewrite ^/analyze(/uploads/.*)$ $1 break;
        proxy_pass http://$docpilot_upstream;
    }

    location /extract/ws {
        set $datamosaic_ws datamosaic:8765;
        rewrite ^/extract/ws$ / break;
        proxy_pass http://$datamosaic_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /api/ {
        set $datamosaic_upstream datamosaic:5000;
        proxy_pass http://$datamosaic_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
    }

    location /platform/api/ {
        set $platform_upstream api:8000;
        rewrite ^/platform(/api/.*)$ $1 break;
        proxy_pass http://$platform_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /analyze/ { try_files $uri $uri/ /analyze/index.html; }
    location /extract/ { try_files $uri $uri/ /extract/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
