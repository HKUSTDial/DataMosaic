name: Build website branch

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: website-branch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        id: pages
      - run: npm ci
        working-directory: web
      - run: node --test tests/pages-publish.test.mjs
        working-directory: web
      - name: Build static preview
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm run build -- --mode pages --base="$PAGES_BASE"
          node scripts/prepare-pages.mjs
        working-directory: web
      - name: Update gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          gh auth setup-git
          bash web/scripts/publish-pages.sh web/dist "$REPOSITORY_URL"
      - name: Request branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '[.build_type, .source.branch, .source.path] | join(" ")')
          if [[ "$source" == "legacy gh-pages /" ]]; then
            # GITHUB_TOKEN pushes do not trigger a Pages build by themselves.
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
            echo 'gh-pages updated and a Pages build requested. Check the separate pages build and deployment run for the deployment result.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::notice::gh-pages is ready. Set Settings > Pages > Source to Deploy from a branch, select gh-pages / (root), and save.'
            echo 'gh-pages updated. To publish it, select Deploy from a branch > gh-pages > / (root) in Settings > Pages and save.' >> "$GITHUB_STEP_SUMMARY"
          fi
